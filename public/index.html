<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lemon Talent OS</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo.svg">
<meta name="theme-color" content="#161616">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: fixed left rail (top strip on phones) + one working canvas; drawer slides in from the right for any record. */
:root{
  /* Paleta y tipografía de lemontalent.com: fondo blanco roto, negro, lima y violeta */
  --bg:#F9F9F9; --surface:#FFFFFF; --sunken:#F1F1F1; --ink:#111111; --muted:#5E5E5E; --line:#E3E3E3;
  --lemon:#D9E151; --lila:#B693F7; --violeta:#3D1A8A; --lemon-ink:#5C6100; --lemon-soft:#F2F5C8;
  --ok:#2F7A4B; --ok-soft:#DDEFE3; --warn:#9A6200; --warn-soft:#F8E9C9; --crit:#B23A2E; --crit-soft:#F6DCD8; --info:#3D1A8A; --info-soft:#ECE4FD;
  --f-display:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111411; --surface:#191D19; --sunken:#0D100D; --ink:#E8EBE4; --muted:#9AA396; --line:#2B312A;
  --lemon:#D9E151; --lemon-ink:#D9E151; --lemon-soft:#33361A; --info:#B693F7; --info-soft:#271E3D;
  --ok:#6FC491; --ok-soft:#1C3324; --warn:#E5B35A; --warn-soft:#3A2D12; --crit:#F08A7E; --crit-soft:#3D1D19; --info:#86B6E3; --info-soft:#18293A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111411; --surface:#191D19; --sunken:#0D100D; --ink:#E8EBE4; --muted:#9AA396; --line:#2B312A;
  --lemon:#D9E151; --lemon-ink:#D9E151; --lemon-soft:#33361A; --info:#B693F7; --info-soft:#271E3D;
  --ok:#6FC491; --ok-soft:#1C3324; --warn:#E5B35A; --warn-soft:#3A2D12; --crit:#F08A7E; --crit-soft:#3D1D19; --info:#86B6E3; --info-soft:#18293A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
.num,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
a{color:inherit;text-decoration-color:var(--lemon);text-decoration-thickness:2px;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--lemon-ink);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;flex:none;display:block}
.brand b{font:700 16px var(--f-display);display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunken);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--lemon-soft);color:var(--ink)}
.nav a[aria-current="page"] .cnt{background:var(--lemon);color:#2A2600}
.cnt{font:500 11px var(--f-data);background:var(--sunken);padding:1px 7px;border-radius:10px}
.nav-sep{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.rail-foot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.role{display:inline-flex;align-self:flex-start;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--sunken)}

main{padding-block:24px 64px;padding-inline:clamp(16px,3vw,36px);min-width:0;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{margin:4px 0 0;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.lemon{background:var(--lemon);color:#2A2600;border-color:var(--lemon)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--crit)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:64px}
select{padding-right:6px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{white-space:nowrap;overflow-wrap:normal;overflow:hidden;text-overflow:ellipsis;font:600 clamp(18px,5vw,26px) var(--f-data);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:4px 10px;border-radius:14px;background:var(--sunken);color:var(--muted);border:1px solid transparent;font-family:inherit}
.chip b{color:var(--ink);font-family:var(--f-data);font-weight:500}
button.chip{cursor:pointer} button.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.warn b{color:var(--warn)}
.wk-bar{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px} .wk-bar .grow{flex:1}
.seg.tabs button{font-size:14px;padding:7px 14px}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:4px}
.sc-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:default}
.sc-card .label{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500}
.sc-v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sc-v .v{font:500 22px var(--f-data);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.delta{font-size:12px;color:var(--muted);font-family:var(--f-data);white-space:nowrap}
.delta.up{color:var(--ok)} .delta.down{color:var(--crit)}
.sc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.spark{width:100%;max-width:130px;height:30px;color:var(--muted)}
details.more{margin-top:8px} details.more>summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0;list-style-position:inside}
details.more>summary:hover{color:var(--ink)}
.sc-tab th.cur,.sc-tab td.cur{background:var(--lemon-soft)}
.sc-tab td:first-child{position:sticky;left:0;background:var(--surface);min-width:220px}
.meter.goal i{background:var(--ok)}
@media (max-width:820px){.sc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sc-v .v{font-size:19px}.sc-card{padding:10px}}
.panel.cal.crit{border-left:3px solid var(--crit)} .panel.cal.warn{border-left:3px solid var(--warn)} .panel.cal.info{border-left:3px solid var(--info)}
.kpi .s{font-size:12px;color:var(--muted)}
.meter{height:5px;background:var(--sunken);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--lemon);border-radius:3px}
.meter.over i{background:var(--crit)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.lemon{background:var(--lemon-soft);color:var(--lemon-ink)}
.pill.plain::before{display:none}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;background:var(--sunken);color:var(--muted)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--sunken)}
td.r,th.r{text-align:right} td.num{white-space:nowrap}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{font-size:15px}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.card .body{font-size:13px;display:flex;flex-direction:column;gap:6px}
.card .body p{margin:0}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.stages{display:flex;gap:3px;flex-wrap:wrap}
.stages span{font:500 11px var(--f-data);background:var(--sunken);padding:1px 6px;border-radius:4px;color:var(--muted)}
.stages span b{color:var(--ink);font-weight:600}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunken);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;font-size:13px;cursor:pointer}
.mini:hover{border-color:var(--muted)}
.mini b{font-weight:600}
.mini select{font-size:12px;padding:3px 6px}

.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.row:last-child{border-bottom:0}
.row .grow{min-width:0;flex:1}
.row .grow div{overflow:hidden;text-overflow:ellipsis}
.subview{display:flex;flex-direction:column;gap:18px}.subview > .head h1{font-size:20px}
.segcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.segcard-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.segcard-nums{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
details.note summary{cursor:pointer;font-weight:600;color:var(--ink)}
.mf{display:inline-flex;align-items:flex-end;gap:2px;height:24px;vertical-align:middle}
.mf i{width:9px;background:var(--lemon);border-radius:2px 2px 0 0}.mf i.z{background:var(--line)}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;align-items:center;gap:10px;font-size:13px}
.bar .track{height:10px;background:var(--sunken);border-radius:5px;position:relative;overflow:hidden}
.bar .track i{position:absolute;inset:0 auto 0 0;background:var(--lemon);border-radius:5px}
.bar .track.over i{background:var(--crit)}

.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{font-size:12.5px;color:var(--muted);background:var(--sunken);border-radius:10px;padding:8px 12px}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-data)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,10,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer-h{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--surface)}
.drawer-b{padding:18px 20px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.drawer-f{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;background:var(--surface)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select{width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.section{display:flex;flex-direction:column;gap:10px}
.section > .label{border-bottom:1px solid var(--line);padding-bottom:6px}
.log{display:flex;flex-direction:column;gap:10px}
.log div{font-size:13px;border-left:2px solid var(--line);padding-left:10px}
.log small{color:var(--muted);display:block;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:30;box-shadow:var(--shadow)}
.toast.err{background:var(--crit);color:#fff}
.toast-undo{margin-left:10px;background:var(--lemon);color:#1a1a00;border:0;border-radius:999px;padding:4px 12px;font:600 13px var(--f-body);cursor:pointer}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
td.acts{display:table-cell}td.acts > *{margin:2px 4px 2px 0;vertical-align:middle}
.row.gasto .acts{justify-content:flex-end}
.row.omit b,.row.omit .num{text-decoration:line-through;color:var(--muted)}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  /* Barra superior en dos filas: logo + buscador, y abajo las secciones con scroll horizontal */
  .rail{position:sticky;top:0;z-index:10;height:auto;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"brand search" "nav nav";align-items:center;gap:10px 12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;border-right:0;border-bottom:1px solid var(--line)}
  .brand{grid-area:brand;padding:0}
  .brand > div{display:none}
  .gsearch{grid-area:search;min-width:0}
  .gsearch input{height:40px}
  .nav{grid-area:nav;flex-direction:row;overflow-x:auto;margin:0 -16px;padding:0 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:8px 12px;font-size:15px}
  .nav a .cnt{display:none}
  .rail-foot,.nav-sep{display:none}
  body{font-size:15px}
  /* 16px evita que iOS haga zoom al tocar un campo */
  input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],input[type=password],select,textarea{font-size:16px;padding:8px 10px}
  .btn{padding:9px 14px;font-size:14px}
  .btn.sm{padding:6px 11px;font-size:13px}
  .seg button{padding:8px 12px;font-size:14px}
  main{padding-block:18px 56px;gap:18px}
  .head{align-items:flex-start}
  .head .toolbar{width:100%}
  /* Menos texto y nada partido en dos líneas: descripciones ocultas, segmentados con scroll, filtros de a dos */
  .head > div > p:not(.keep){display:none}
  .head{gap:10px}
  .seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{white-space:nowrap;flex:none}
  .toolbar > select{flex:1 1 140px;min-width:0}
  .toolbar > input[type=search]{flex:1 1 100%;min-width:0}
  .head .toolbar > span{flex:1 1 100%}
  .head .toolbar .btn{padding:7px 12px;font-size:13.5px}
  .note{font-size:13px}
  .solo-desk{display:none}
  td.num,td.r,th{white-space:nowrap}
  th,td{padding:8px 10px}
  .tablewrap input[type=text]{min-width:130px}
  .tablewrap input[type=number]{min-width:72px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi .v{font-size:clamp(17px,5.2vw,22px)}
  .kpi .label{font-size:10.5px}
  .panel{padding:14px}
  .form{grid-template-columns:1fr}
  .bar{grid-template-columns:96px minmax(0,1fr) 78px;gap:8px}
  .bar > span:last-child{text-align:right}
  .bar > span:last-child{white-space:nowrap;font-size:12.5px}
  .board{grid-auto-columns:minmax(78vw,1fr)}
  .col{min-height:72px}
  h1{font-size:24px}
  h2{font-size:17px}
}
@media (min-width:821px){.solo-mob{display:none!important}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

[hidden]{display:none!important}
.gsearch{position:relative}.gsearch input{width:100%}
.gres{position:absolute;left:0;right:-180px;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:40;max-height:60vh;overflow:auto;padding:4px}
.gitem{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:6px;cursor:pointer;color:inherit;font:inherit;font-size:13px}.gitem:hover,.gitem.on{background:var(--hover,rgba(0,0,0,.05))}.gitem .muted{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:820px){.gsearch{min-width:160px}.gres{right:auto;width:min(92vw,420px)}}
body{margin:0}
.login{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:16px;padding-inline:16px}
.login .panel{gap:14px}
.login input{width:100%}
